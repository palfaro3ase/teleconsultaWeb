<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agendar Teleconsulta</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 600px; margin: 2rem auto; padding: 0 1rem; line-height: 1.5; }
        .form-group { margin-bottom: 1rem; }
        label { display: block; margin-bottom: 0.5rem; font-weight: 600; }
        input, select { width: 100%; padding: 0.75rem; border: 1px solid #ccc; border-radius: 6px; font-size: 1rem; box-sizing: border-box; }
        button { width: 100%; padding: 0.75rem; background-color: #2563eb; color: white; border: none; border-radius: 6px; font-size: 1rem; font-weight: 600; cursor: pointer; margin-top: 1rem; }
        button:hover { background-color: #1d4ed8; }
        button:disabled { background-color: #93c5fd; cursor: not-allowed; }
        .message { margin-top: 1rem; padding: 1rem; border-radius: 6px; display: none; }
        .success { background-color: #dcfce7; color: #166534; border: 1px solid #86efac; }
        .error { background-color: #fee2e2; color: #991b1b; border: 1px solid #fca5a5; }
    </style>
    <!-- Librería de Supabase desde CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <h1>Agendar Teleconsulta</h1>
    <form id="consultaForm">
        <div class="form-group">
            <label for="patientName">Nombre completo</label>
            <input type="text" id="patientName" required>
        </div>
        <div class="form-group">
            <label for="patientPhone">Teléfono</label>
            <input type="tel" id="patientPhone" required>
        </div>
        <div class="form-group">
            <label for="doctorId">Médico</label>
            <select id="doctorId" required>
                <option value="">Cargando médicos...</option>
            </select>
        </div>
        <div class="form-group">
            <label for="appointmentDate">Fecha y hora</label>
            <input type="datetime-local" id="appointmentDate" required>
        </div>
        <div class="form-group">
            <label style="display: flex; align-items: center; gap: 0.5rem; font-weight: normal;">
                <input type="checkbox" id="consent" required style="width: auto;">
                Doy mi consentimiento informado para recibir atención por teleconsulta y el tratamiento de mis datos de salud conforme a la Ley 29733.
            </label>
        </div>
        <button type="submit" id="submitBtn">Confirmar cita</button>
    </form>
    <div id="message" class="message"></div>

    <script>
        // 1. CONFIGURACIÓN: Reemplaza la clave de abajo con tu clave ANON real
        const SUPABASE_URL = "https://rspbmkyhtybxbxhchzry.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJzcGJta3lodHlieGJ4aGNoenJ5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkzNDgxMDQsImV4cCI6MjEwNDkyNDEwNH0.h2urzneJLrLMnG-rB_aovQV3zwitc7vtbZGhltKqv50";

        // 2. Inicializar cliente (usamos window.supabase para evitar conflictos de declaración)
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const form = document.getElementById('consultaForm');
        const doctorSelect = document.getElementById('doctorId');
        const messageDiv = document.getElementById('message');
        const submitBtn = document.getElementById('submitBtn');

        function showMessage(text, isError = false) {
            messageDiv.textContent = text;
            messageDiv.className = `message ${isError ? 'error' : 'success'}`;
            messageDiv.style.display = 'block';
        }

        // 3. Cargar médicos activos
        async function loadDoctors() {
            try {
                const { data, error } = await supabaseClient
                    .from('doctors')
                    .select('id, full_name, specialty')
                    .eq('active', true);

                if (error) throw error;

                doctorSelect.innerHTML = '<option value="">Selecciona un médico</option>';
                if (data && data.length > 0) {
                    data.forEach(doc => {
                        const option = document.createElement('option');
                        option.value = doc.id;
                        option.textContent = `${doc.full_name} - ${doc.specialty}`;
                        doctorSelect.appendChild(option);
                    });
                } else {
                    doctorSelect.innerHTML = '<option value="">No hay médicos disponibles</option>';
                }
            } catch (err) {
                console.error("Error cargando médicos:", err);
                showMessage("Error al cargar médicos. Revisa la consola (F12).", true);
            }
        }

        // 4. Enviar formulario
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            submitBtn.disabled = true;
            submitBtn.textContent = "Procesando...";
            messageDiv.style.display = 'none';

            const jitsiRoom = `teleconsulta-${Date.now()}-${Math.random().toString(36).substring(2, 9)}`;

            try {
                const { data, error } = await supabaseClient
                    .from('appointments')
                    .insert([{
                        patient_name: document.getElementById('patientName').value,
                        patient_phone: document.getElementById('patientPhone').value,
                        doctor_id: document.getElementById('doctorId').value,
                        scheduled_at: document.getElementById('appointmentDate').value,
                        jitsi_room: jitsiRoom,
                        status: 'agendada'
                    }])
                    .select()
                    .single();

                if (error) throw error;

                showMessage("¡Cita agendada con éxito! El médico recibirá la notificación en Telegram.");
                form.reset();
                loadDoctors();
            } catch (err) {
                console.error("Error al agendar:", err);
                showMessage(`Error: ${err.message}`, true);
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = "Confirmar cita";
            }
        });

        // Iniciar
        loadDoctors();
    </script>
</body>
</html>
